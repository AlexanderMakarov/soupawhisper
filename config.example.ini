[whisper]
# Model size: tiny.en, base.en, small.en, medium.en, large-v3
model = base.en

# Device: cpu or cuda (cuda requires cuDNN)
device = cpu

# Compute type: int8 for CPU, float16 for GPU
compute_type = int8

# Language: en, es, ru, auto (auto = detect language automatically, best with non-*.en models)
language = en

# When language = auto: optional comma-separated ISO codes to restrict detection (e.g. only English and Russian).
# Whisper still scores all languages internally; we pick the highest-probability code in this list.
# Helps avoid wrong-language typing on short or noisy audio (e.g. subscription forms).
# language_allowlist = en, ru

[input]
# Audio input device: device index (e.g., 0, 8) or partial device name (e.g., "pulse", "HDA Intel").
# Leave empty to use default device. Run with --verbose to see available devices.
# audio_input_device =

[hotkey]
# Key to hold for recording: F12, scroll_lock, pause, etc.
key = f12

[behavior]
# If streaming is enabled by default.
default_streaming = true

# Show desktop notification
notifications = true

# Menu bar (macOS) / system tray (Linux) status icon. Default on.
# If true and no tray host / AppIndicator bindings are available for this Python, SoupaWhisper exits.
# Linux: needs StatusNotifier host + gi/AppIndicator for the same interpreter (see README).
# Distro Python + apt python3-gi is easiest; uv/standalone Pythons need PyGObject from source
# or a third-party repo that matches that Python. Without a GUI tray, set tray_icon = false.
tray_icon = true
# Show EN/RU/AUTO beside the icon on AppIndicator (Linux) / menu bar title (macOS),
# and in the tooltip. Session language from layout wins over config when set.
tray_show_language = true

# Copy resulting text to clipboard
clipboard = true

# Type text into active input field
auto_type = true

# Automatically format text as sentence: capitalize first letter and add period at end
auto_sentence = true

# Delay between typing characters in seconds. Make bigger to visualize the typing process.
typing_delay = 0.01

# Save recordings to /tmp with timestamped filenames (disable automatic deletion)
save_recordings = false

# Streaming-only: suppress specific hallucinated/noise phrases.
# If set, any *streaming chunk* that equals one of these phrases (punctuation ignored) is skipped
# (not typed, not added to clipboard output). Multiple phrases in one chunk are NOT rejected.
reject_phrases = thank you, thanks, okay, ok, um, hmm

# Optional: comma-separated custom terms / glossary that Whisper should prefer.
# Improves recognition of names, brands, technical terms, acronyms, multi-word
# phrases, etc. Passed to faster-whisper as both initial_prompt (in-context
# priming) and hotwords (decoder logit bias). Applies to streaming and
# non-streaming modes. Leave empty to disable. Note: this is a *hint*, not a
# guarantee — strongly mismatched audio may still produce other words.
# custom_terms = Claude, Kubernetes, GraphQL, ML repository

# Optional: when [whisper].language=auto, enforce language from current keyboard layout (captured once on start).
# enforce_language_from_layout = true
# layout_to_language = com.apple.keylayout.US:en, com.apple.keylayout.ABC:en, com.apple.keylayout.Russian:ru

[streaming]
# Minimum speech length in seconds required to finalize a speech chunk.
min_speech_length_seconds = 1.0

# Silence duration in seconds required to finalize a speech chunk.
vad_silence_threshold_seconds = 0.5

# Sample rate for streaming audio and VAD (should match Whisper model, 16000 Hz recommended).
vad_sample_rate = 16000

# Size of audio chunks for SAD analysis in milliseconds. Only 10, 20, 30 are supported for now.
vad_chunk_size_ms = 20

# Minimum number of consecutive speech chunks with detected speech required to ensure speech is active.
vad_min_speech_chunks = 10

# VAD aggressiveness threshold (0.0-3.0, lower = more sensitive).
vad_threshold = 1.0

[meeting]
# Meeting recording mode (Linux/PipeWire only). Captures TWO tracks -- your mic and
# the default sink's monitor (everyone else) -- then transcribes both after you stop
# and merges them into one speaker-labelled Markdown transcript.
#
# IMPORTANT: use headphones. On open speakers your mic also picks up the other
# participants, so their words land on BOTH tracks and appear under "Me" as well.
#
# Meeting mode and dictation are mutually exclusive: while a meeting records, the
# dictation hotkey does nothing, so transcribed text can never be typed into the call.

# Where merged transcripts are kept (created if missing). These are never deleted.
transcript_dir = ~/Documents/meetings

# Hard stop, in minutes, so a forgotten recording cannot run all day (~230 MB/hour).
max_duration_min = 120

# Auto-stop after this many minutes with no speech on EITHER track. 0 disables it.
# Generous on purpose: a false stop loses the rest of the meeting, while
# over-recording only costs disk. Real meetings do go quiet while people read.
silence_stop_min = 10

# Optional global combo to start/stop a meeting, e.g. "shift+f12". Empty = tray only.
# Deliberately a combo so it cannot be hit by accident mid-call.
hotkey =

# Threads for the meeting model (default: half the logical cores). Meeting
# transcription uses its OWN model instance, so dictation stays usable while it runs.
# Measured on an i5-10300H (4 physical cores + HT), 57s of silence-heavy audio:
#   1 thread 32.2s | 2 threads 19.1s | 4 threads 12.9s | 8 threads 37.1s
# 8 oversubscribes and is slower than 1, so half the logical cores is both the
# fastest setting and the one that leaves CPU for dictation.
# cpu_threads = 4

# Keep the WAVs after a successful transcript (default false, ~230 MB/hour).
# Turn on to re-run a bad transcript with different settings -- without the audio a
# poor result cannot be investigated.
# keep_audio = false

# --- Speech-run segmentation -------------------------------------------------
# Each track is cut into "speech runs" by the silero VAD before transcription, and
# the language is detected on every run separately. This is what makes a bilingual
# call work: fixed 30-second windows got ONE language vote each, so an English
# sentence sharing a window with more Russian was decoded as Russian and vanished.
# Run boundaries also supply the timestamps -- Whisper stretches a segment back over
# a silent lead-in, which stamped speech spoken at 10s as 00:00:00.
#
# Silence between runs is never sent to the model, which is also the first
# hallucination guard: given nothing to hear, Whisper invents training-data text
# ("Редактор субтитров ...", "Thanks for watching!").
#
# To tune: set keep_audio = true, record a sample, then re-run the same WAVs with
# different values and diff the transcripts. transcribe.log lists every run with its
# offset, duration and detected language.

# How long a pause must be, in ms, to END a run. Lower = more, shorter runs, so the
# language can switch more often -- at the cost of splitting one sentence across its
# own breathing pauses. Higher = longer runs that may swallow a language switch.
# faster-whisper's own default is 2000, long enough to swallow a whole turn change.
# run_min_silence_ms = 700

# Audio kept either side of a run, in ms, so the decoder hears the attack of the
# first word and the tail of the last -- VAD boundaries sit tight against the speech.
# Too low clips leading consonants; too high pulls neighbouring noise into the run.
# silero's default is 400.
# run_pad_ms = 200

# Speech probability a 32ms frame must clear to count as speech (0.0-1.0).
# Lower = quiet or distant talk survives, but noise leaks in and Whisper will
# hallucinate on it. Higher = only clear speech, at the risk of dropping soft words.
# run_vad_threshold = 0.5

# Drop runs shorter than this many ms. 0 keeps everything the VAD called speech.
# Raise it if single coughs, keyboard clicks or door sounds become their own runs.
# run_min_speech_ms = 0

# Split a run longer than this many seconds. Whisper detects language from one 30s
# window, so without a cap a long monologue stays locked to whatever its first 30s
# scored. Lower = language can change mid-monologue; higher = fewer encoder passes.
# run_max_seconds = 30

# Second hallucination guard: drop a decoded segment whose avg_logprob is below this.
# Measured on real audio: -2.2 for invented subtitle credits, -0.26 for a clear
# sentence, -1.09 for a genuine one-word answer ("Всё."). Hence -1.5 rather than
# Whisper's own -1.0 default, which threw that real word away. Raise toward -1.0 if
# junk still appears; lower toward -2.0 if short real words go missing.
# Dropped segments are counted in transcribe.log.
# min_avg_logprob = -1.5

# --- Transcript shape and vocabulary -----------------------------------------

# Glossary priming for meeting transcription (comma-separated). Defaults to
# [behavior] custom_terms; set it here when meeting vocabulary differs from what you
# dictate day to day. Measured on a real interview, without priming Whisper wrote
# "sync 8 group" for sync.WaitGroup and "cup flow, air flow" for Kubeflow, Airflow.
# It is not free: a listed term can also be forced onto audio that did not contain
# it ("outage of such red limits" became "outage of Saga Red Limits"). Keep the list
# to words that actually recur in your meetings, and re-run a kept recording to
# check the trade before trusting it.
# custom_terms = Redis, Kubernetes, Kubeflow, Airflow, idempotency, goroutine

# How many seconds one speaker may talk before the transcript starts a new block
# with a fresh timestamp. Your own track is capped at 60s: measured against a
# professional transcript of the same 73-minute interview, 60s gives 86 blocks with a
# 110-word longest, against that transcript's 88 blocks and 121 words. The earlier
# 600s produced 415-word walls of text. Lower for finer timestamps, higher to keep a
# long answer whole.
# me_max_block_seconds = 60

# Same cap for the other side. Lower by default because the monitor track may carry
# several people and silence length does not reliably mark a speaker change, so a
# fresh timestamp every 20s is what keeps turns apart.
# them_max_block_seconds = 20
